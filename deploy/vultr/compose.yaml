name: restaurantos
services:
  app:
    image: restaurantos:${APP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/vultr/Dockerfile
    env_file:
      - path: ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE to the absolute runtime secret file path}
        format: raw
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    expose:
      - "3000"
    volumes:
      - restaurant_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notifications}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  restaurant_data:
  caddy_data:
  caddy_config:
